backend:
  name: git-gateway
  branch: main

# Per provare il pannello in locale con "npx decap-server" togli il commento:
# local_backend: true

media_folder: "src/assets/img"
public_folder: "/assets/img"

locale: "it"

site_url: https://studio-sharon-bellia.netlify.app
display_url: https://studio-sharon-bellia.netlify.app

collections:
  # ─────────────────────────────────────────────
  # IMPOSTAZIONI DEL SITO (dati che compaiono ovunque)
  # ─────────────────────────────────────────────
  - name: "impostazioni"
    label: "Impostazioni sito"
    delete: false
    editor:
      preview: false
    files:
      - name: "generali"
        label: "Dati dello studio"
        file: "src/_data/site.json"
        description: "Nome, contatti, indirizzo, orari e social: si aggiornano su tutte le pagine."
        fields:
          - { label: "Nome", name: "name", widget: "string" }
          - { label: "Qualifica", name: "qualification", widget: "string" }
          - { label: "Città", name: "city", widget: "string" }
          - { label: "Tagline (sottotitolo del logo)", name: "tagline", widget: "string" }
          - { label: "Descrizione per Google (SEO)", name: "description", widget: "text" }
          - { label: "Dominio del sito", name: "domain", widget: "string", hint: "Es. studiosharonbellia.it" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Telefono (come mostrarlo)", name: "phone_display", widget: "string" }
          - { label: "Numero WhatsApp", name: "whatsapp_number", widget: "string", hint: "Solo cifre, con prefisso: 393298335497" }
          - { label: "Messaggio WhatsApp precompilato", name: "whatsapp_message", widget: "string" }
          - { label: "Via e numero civico", name: "address_street", widget: "string" }
          - { label: "CAP", name: "address_postal", widget: "string" }
          - { label: "Città (indirizzo)", name: "address_city", widget: "string" }
          - { label: "Provincia", name: "address_province", widget: "string" }
          - { label: "Link a Google Maps", name: "maps_url", widget: "string" }
          - { label: "Indirizzo per la mappa incorporata", name: "maps_embed_query", widget: "string", hint: "Es. Piazza+Europa+6,+Caltanissetta" }
          - label: "Orari di apertura"
            name: "hours"
            widget: "list"
            label_singular: "Riga orario"
            summary: "{{fields.label}} — {{fields.value}}"
            fields:
              - { label: "Giorno", name: "label", widget: "string" }
              - { label: "Orario", name: "value", widget: "string" }
          - label: "Social"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook (URL)", name: "facebook", widget: "string", required: false }
              - { label: "Instagram (URL)", name: "instagram", widget: "string", required: false }
          - { label: "Albo professionale", name: "albo", widget: "string" }
          - { label: "Partita IVA", name: "piva", widget: "string" }

  # ─────────────────────────────────────────────
  # TESTI DELLA HOME (tutte le sezioni)
  # ─────────────────────────────────────────────
  - name: "home"
    label: "Home"
    delete: false
    editor:
      preview: false
    files:
      - name: "contenuti"
        label: "Sezioni della Home"
        file: "src/_data/home.json"
        description: "Tutti i testi, gli elenchi e le FAQ della homepage."
        fields:
          - label: "1 · Sezione iniziale (hero)"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo principale", name: "title", widget: "text", hint: "Per il corsivo usa <em>parola</em>" }
              - { label: "Sottotitolo", name: "subtitle", widget: "text" }
              - { label: "Bottone principale · testo", name: "cta_primary_label", widget: "string" }
              - { label: "Bottone principale · link", name: "cta_primary_href", widget: "string" }
              - { label: "Bottone secondario · testo", name: "cta_secondary_label", widget: "string" }
              - { label: "Bottone secondario · link", name: "cta_secondary_href", widget: "string" }
              - { label: "Riga disponibilità", name: "availability", widget: "string" }
          - label: "2 · Frase narrativa"
            name: "intro_narrativa"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Testo", name: "text", widget: "text", hint: "Per il corsivo usa <em>parola</em>" }
              - { label: "Firma", name: "sign", widget: "string" }
          - label: "3 · Chi sono (titolo)"
            name: "intro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo introduttivo", name: "text", widget: "text" }
          - label: "3 · Chi sono (dettagli)"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Didascalia ritratto", name: "portrait_caption", widget: "string" }
              - label: "Paragrafi"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragrafo", name: "testo", widget: "text" }
              - label: "Titoli / formazione"
                name: "credentials"
                widget: "list"
                label_singular: "Voce"
                summary: "{{fields.label}} — {{fields.text}}"
                fields:
                  - { label: "Etichetta", name: "label", widget: "string" }
                  - { label: "Testo", name: "text", widget: "string" }
                  - { label: "Fonte (testo del link)", name: "source_text", widget: "string" }
                  - { label: "Fonte (URL)", name: "source_url", widget: "string" }
                  - { label: "Testo aggiuntivo", name: "source_suffix", widget: "string", required: false }
          - label: "4 · Ambiti di intervento"
            name: "ambiti"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
              - label: "I tre ambiti"
                name: "items"
                widget: "list"
                label_singular: "Ambito"
                summary: "{{fields.title}}"
                hint: "Consigliato mantenere 3 blocchi (grafica dedicata a ciascuno)."
                fields:
                  - { label: "Occhiello", name: "eyebrow", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "text" }
                  - { label: "Testo", name: "text", widget: "text" }
                  - { label: "Link · testo", name: "link_text", widget: "string" }
                  - { label: "Link · pagina", name: "link_href", widget: "string" }
                  - label: "Elenco puntato"
                    name: "list"
                    widget: "list"
                    field: { label: "Voce", name: "voce", widget: "string" }
          - label: "5 · Citazione"
            name: "quote"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Firma", name: "cite", widget: "string" }
          - label: "6 · Domande frequenti (FAQ)"
            name: "faq"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - label: "Domande"
                name: "items"
                widget: "list"
                label_singular: "Domanda"
                summary: "{{fields.q}}"
                fields:
                  - { label: "Domanda", name: "q", widget: "string" }
                  - { label: "Risposta", name: "a", widget: "text", hint: "Puoi inserire link con <a href=\"...\">testo</a>" }
          - label: "7 · Richiedi contatto"
            name: "booking"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Etichetta", name: "badge", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
          - label: "7 · Recapiti (colonna contatti)"
            name: "contatti"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Nota", name: "note", widget: "text" }
              - { label: "Riga Online", name: "online", widget: "string" }
              - { label: "Testo consenso privacy", name: "privacy_label", widget: "text", hint: "Puoi inserire link con <a href=\"...\">testo</a>" }

  # ─────────────────────────────────────────────
  # PAGINE (tutte le sezioni delle pagine interne)
  # ─────────────────────────────────────────────
  - name: "pagine"
    label: "Pagine"
    delete: false
    editor:
      preview: false
    files:
      # ---------- COMPETENZE ----------
      - name: "competenze"
        label: "Competenze"
        file: "src/_data/pages/competenze.json"
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
          - label: "Fascia credenziali"
            name: "strip"
            widget: "object"
            collapsed: true
            fields:
              - label: "Voci"
                name: "items"
                widget: "list"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Testo", name: "text", widget: "string" }
                  - { label: "In grassetto", name: "strong", widget: "boolean", default: false }
              - { label: "Link · testo", name: "link_text", widget: "string" }
              - { label: "Link · URL", name: "link_url", widget: "string" }
          - label: "Riquadri formazione"
            name: "cards"
            widget: "list"
            label_singular: "Riquadro"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icona", name: "icon", widget: "select", options: ["cappello", "piu", "righe", "libro"] }
              - { label: "Titolo", name: "title", widget: "string" }
              - label: "Voci"
                name: "items"
                widget: "list"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Testo", name: "text", widget: "string" }
                  - label: "Note (righe piccole)"
                    name: "notes"
                    widget: "list"
                    summary: "{{fields.text}}"
                    fields:
                      - { label: "Testo", name: "text", widget: "string" }
                      - { label: "Link (URL)", name: "url", widget: "string", required: false }
                      - { label: "Testo dopo il link", name: "suffix", widget: "string", required: false }
          - label: "Fascia finale (CTA)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }

      # ---------- RISORSE ----------
      - name: "risorse"
        label: "Risorse"
        file: "src/_data/pages/risorse.json"
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
          - label: "Materiali (card)"
            name: "cards"
            widget: "list"
            label_singular: "Materiale"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icona", name: "icon", widget: "select", options: ["documento", "scudo", "modulo", "cuore", "bussola"] }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Link · testo", name: "link_text", widget: "string" }
              - { label: "Link · pagina", name: "link_href", widget: "string" }
          - { label: "Nota finale", name: "note", widget: "text" }
          - label: "Fascia finale (CTA)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }

      # ---------- DOVE TROVARMI ----------
      - name: "dove-trovarmi"
        label: "Dove trovarmi"
        file: "src/_data/pages/dove-trovarmi.json"
        description: "Indirizzo, orari, mappa e recapiti si modificano da «Impostazioni sito»."
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
          - { label: "Testo link mappa", name: "map_cta", widget: "string" }
          - { label: "Occhiello recapiti", name: "recapiti_eyebrow", widget: "string" }
          - { label: "Titolo orari", name: "hours_title", widget: "string" }
          - { label: "Nota", name: "note", widget: "text" }
          - label: "Fascia finale (CTA)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }

      # ---------- PERCORSO E MODALITÀ ----------
      - name: "percorso-modalita"
        label: "Percorso e modalità"
        file: "src/_data/pages/percorso-modalita.json"
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
          - label: "Percorso (passaggi)"
            name: "journey"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - label: "Passaggi"
                name: "steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Numero", name: "num", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Testo", name: "text", widget: "text" }
          - label: "Riquadri informativi"
            name: "operations"
            widget: "list"
            label_singular: "Riquadro"
            summary: "{{fields.title}}"
            fields:
              - { label: "Ancora (id)", name: "id", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Largo (doppia colonna)", name: "wide", widget: "boolean", default: false }
          - { label: "Nota finale", name: "operation_note", widget: "text" }
          - label: "Fascia finale (CTA)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }

      # ---------- PSICOLOGIA CLINICA ----------
      - name: "psicologia-clinica"
        label: "Psicologia clinica"
        file: "src/_data/pages/psicologia-clinica.json"
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }
          - label: "Quando rivolgersi"
            name: "situazioni"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
              - label: "Situazioni"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Testo", name: "text", widget: "text" }
          - label: "Come lavoro"
            name: "come_lavoro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
              - label: "Metodo"
                name: "method"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Numero", name: "n", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "desc", widget: "text" }
          - label: "In pratica"
            name: "pratica"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - label: "Passaggi"
                name: "steps"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Numero", name: "num", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Testo", name: "text", widget: "text" }
          - label: "Domande frequenti"
            name: "faq"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - label: "Domande"
                name: "items"
                widget: "list"
                summary: "{{fields.q}}"
                fields:
                  - { label: "Domanda", name: "q", widget: "string" }
                  - { label: "Risposta", name: "a", widget: "text", hint: "Puoi inserire link con <a href=\"...\">testo</a>" }
          - label: "Fascia finale (CTA)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }

      # ---------- PSICOTERAPIA ----------
      - name: "psicoterapia"
        label: "Percorsi continuativi"
        file: "src/_data/pages/psicoterapia.json"
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }
          - label: "Nota trasparenza"
            name: "nota"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
          - label: "Quando può servire"
            name: "situazioni"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
              - label: "Situazioni"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Testo", name: "text", widget: "text" }
          - label: "Come lavoro"
            name: "come_lavoro"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Testo", name: "text", widget: "text" }
              - label: "Metodo"
                name: "method"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Numero", name: "n", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "desc", widget: "text" }
          - label: "Domande frequenti"
            name: "faq"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - label: "Domande"
                name: "items"
                widget: "list"
                summary: "{{fields.q}}"
                fields:
                  - { label: "Domanda", name: "q", widget: "string" }
                  - { label: "Risposta", name: "a", widget: "text", hint: "Puoi inserire link con <a href=\"...\">testo</a>" }
          - label: "Fascia finale (CTA)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }

      # ---------- PSICOLOGIA FORENSE ----------
      - name: "psicologia-forense"
        label: "Psicologia forense"
        file: "src/_data/pages/psicologia-forense.json"
        fields:
          - label: "Intestazione"
            name: "subhero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Occhiello", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "text" }
              - { label: "Sottotitolo", name: "lede", widget: "text" }
              - { label: "Bottone · testo", name: "button_text", widget: "string" }
              - { label: "Bottone · link", name: "button_href", widget: "string" }
          - label: "Destinatari"
