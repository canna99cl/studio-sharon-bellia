  # ─────────────────────────────────────────────
  # ARTICOLI (blog)
  # ─────────────────────────────────────────────
  - name: "articoli"
    label: "Articoli"
    label_singular: "Articolo"
    folder: "src/articoli"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}  ·  {{date | date('DD/MM/YYYY')}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Sommario", name: "summary", widget: "text", hint: "Frase breve mostrata nell'anteprima." }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - "Psicologia clinica"
          - "Psicoterapia"
          - "Psicologia forense"
          - "Benessere"
          - "Relazioni"
          - "Genitorialità"
      - { label: "Tempo di lettura", name: "readtime", widget: "string", required: false, hint: "Es. 4 min" }
      - { label: "Data", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Immagine di copertina (opzionale)", name: "image", widget: "image", required: false }
      - { label: "Contenuto", name: "body", widget: "markdown" }
